name: Backend Regression (Ubuntu)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize database
        run: python -m backend.data init

      - name: Run test_strategy
        id: ts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python -m unittest backend.tests.test_strategy -v 2>&1 | tee ci-logs/test_strategy.log

      - name: Run test_data
        id: td
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python -m unittest backend.tests.test_data -v 2>&1 | tee ci-logs/test_data.log

      - name: Run test_recommendation
        id: tr
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python -m unittest backend.tests.test_recommendation -v 2>&1 | tee ci-logs/test_recommendation.log

      - name: Run test_api
        id: ta
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python -m unittest backend.tests.test_api -v 2>&1 | tee ci-logs/test_api.log

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          python scripts/ci/summarize_unittest.py ci-logs/*.log | tee summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: ci-logs/

      - name: Enforce test result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.ts.outcome }}" = "failure" ] || \
             [ "${{ steps.td.outcome }}" = "failure" ] || \
             [ "${{ steps.tr.outcome }}" = "failure" ] || \
             [ "${{ steps.ta.outcome }}" = "failure" ]; then
            echo "::error::至少一个测试文件失败，详见 ci-logs 与 summary。"
            exit 1
          fi